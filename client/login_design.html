<style>
        .glass-panel {
            background: rgba(29, 37, 59, 0.6);
            backdrop-filter: blur(20px);

<body class="text-on-background min-h-screen flex flex-col items-center justify-center p-6 relative overflow-hidden">
<!-- Background Decorative Elements -->
<div class="absolute top-[-10%] left-[-10%] w-[50%] h-[50%] bg-primary/10 rounded-full blur-[120px] pointer-events-none"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-secondary/5 rounded-full blur-[100px] pointer-events-none"></div>
<main class="w-full max-w-md z-10 flex flex-col items-center">
<!-- Logo & Branding -->
<header class="mb-12 text-center">
<div class="inline-flex items-center justify-center w-20 h-20 mb-6 glass-panel rounded-lg">
<span class="material-symbols-outlined text-4xl text-primary" style="font-variation-settings: 'FILL' 1;">account_balance_wallet</span>
</div>
<h1 class="text-3xl font-black tracking-tighter text-primary drop-shadow-[0_0_8px_rgba(189,157,255,0.4)] mb-2">PaisaTrack</h1>
<p class="text-on-surface-variant font-medium text-lg">Welcome Back</p>
</header>
<!-- Login Form Container -->
<div class="w-full glass-panel p-8 rounded-lg shadow-2xl relative overflow-hidden">
<!-- Subtle internal glow -->
<div class="absolute top-0 left-0 w-full h-[1px] bg-white/10"></div>
<form class="space-y-6">
<!-- Username/Email Field -->
<div class="space-y-2">
<label class="text-[10px] font-bold uppercase tracking-widest text-on-surface-variant px-1" for="email">Email / Username</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-primary transition-colors">person</span>
<input class="w-full bg-surface-container-low border-none rounded-md py-4 pl-12 pr-4 text-on-surface placeholder:text-on-surface-variant/30 focus:ring-2 focus:ring-primary/50 transition-all text-sm" id="email" placeholder="your.name@student.in" type="text"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-end px-1">
<label class="text-[10px] font-bold uppercase tracking-widest text-on-surface-variant" for="password">Password</label>
<a class="text-[10px] font-bold uppercase tracking-widest text-primary-dim hover:text-primary transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-primary transition-colors">lock</span>
<input class="w-full bg-surface-container-low border-none rounded-md py-4 pl-12 pr-12 text-on-surface placeholder:text-on-surface-variant/30 focus:ring-2 focus:ring-primary/50 transition-all text-sm" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary" type="button">
<span class="material-symbols-outlined text-sm">visibility</span>
</button>
</div>
</div>
<!-- Login Button -->
<div class="pt-2">
<button class="w-full bg-gradient-to-br from-primary-dim to-primary text-on-primary-container font-bold py-4 rounded-full glow-button hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2" type="submit">
<span>Login</span>
<span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
</div>
</form>
<!-- Social Login / Alternative -->
<div class="mt-8 pt-8 border-t border-outline-variant/20">
<p class="text-center text-[10px] font-bold uppercase tracking-widest text-on-surface-variant mb-6">Or continue with</p>
<div class="grid grid-cols-2 gap-4">
<button class="flex items-center justify-center gap-2 py-3 glass-panel rounded-md hover:bg-surface-variant transition-colors group">
<img alt="Google" class="w-4 h-4 grayscale group-hover:grayscale-0 transition-all" data-alt="Google brand logo icon for third-party authentication integration" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBaUxrQq8Lw7vVm57HYtlH6K6KvyyX0JzdxCtNLiX0ax7fnlkWvLtz685x6JjRzXlT8zOORhS_QyJ0xgKAGUSShnIekUKvwd3ZqdsuJ3JfdhBS5gY8QLkvKslg9Q1H7KQ38Lx6HRfvWSET-wtD18JUuoAIpZwe9VIPM2jleTb_Ig9ZdvQ1JvJiPAM1ZiY_LpOdYg8HberYj6i96Wn7ySARiMlVMBN8isQmPZhiNQbcNURj0cEy4qS98mdUTVFwgQdPn5VYBJiDS7zQ"/>
<span class="text-xs font-semibold">Google</span>
</button>
<button class="flex items-center justify-center gap-2 py-3 glass-panel rounded-md hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined text-lg">ios</span>
<span class="text-xs font-semibold">Apple</span>
</button>
</div>
</div>
</div>
<!-- Registration Link -->
<footer class="mt-10">
<p class="text-sm text-on-surface-variant">
                Don't have an account? 
                <a class="text-primary font-bold hover:underline underline-offset-4 ml-1 transition-all" href="#">Register</a>
</p>
</footer>
<!-- Security Badge -->
<div class="mt-12 flex items-center gap-2 px-4 py-2 bg-surface-container-low rounded-full">
<span class="material-symbols-outlined text-xs text-secondary">verified_user</span>
<span class="text-[10px] font-bold uppercase tracking-wider text-on-surface-variant/60">Bank-grade 256-bit encryption</span>
</div>
</main>
<!-- Visual Polish: Floating Card (Right) -->
<div class="hidden lg:block absolute right-[10%] top-[30%] w-64 glass-panel p-6 rounded-lg rotate-3 -z-0 opacity-40">
<div class="flex items-center gap-3 mb-4">
<div class="w-10 h-10 rounded-full bg-secondary/20 flex items-center justify-center text-secondary">
<span class="material-symbols-outlined">trending_up</span>
</div>
<div>
<div class="w-20 h-2 bg-outline-variant rounded-full mb-1"></div>
<div class="w-12 h-1.5 bg-outline-variant/50 rounded-full"></div>
</div>
</div>
<div class="w-full h-24 rounded-md bg-surface-container-low mb-4 flex items-end p-2 gap-1">
<div class="w-1/6 h-[20%] bg-primary/20 rounded-t-sm"></div>
<div class="w-1/6 h-[40%] bg-primary/30 rounded-t-sm"></div>
<div class="w-1/6 h-[30%] bg-primary/20 rounded-t-sm"></div>
<div class="w-1/6 h-[70%] bg-primary/60 rounded-t-sm"></div>
<div class="w-1/6 h-[50%] bg-primary/40 rounded-t-sm"></div>
<div class="w-1/6 h-[90%] bg-primary rounded-t-sm"></div>
</div>
</div>
<!-- Visual Polish: Floating Card (Left) -->
<div class="hidden lg:block absolute left-[8%] bottom-[20%] w-56 glass-panel p-5 rounded-lg -rotate-6 -z-0 opacity-30">
<div class="w-full h-32 rounded-lg bg-surface-container-lowest overflow-hidden flex items-center justify-center">
<img alt="Abstract gradient" class="w-full h-full object-cover opacity-50" data-alt="Dreamy abstract gradient pattern with flowing liquid silk textures in shades of deep indigo and soft violet" src="https://lh3.googleusercontent.com/aida-public/AB6AXuApder0Y5lcr-dY6JwBauMyLKJFn1oyag4w7WHdBt3V23zHJWBKad-f0gRmePOG_Pcr6u2C_zCKMeQF1DIZ1bNgDj8Rc6HhcC4bGOnwxWe1DLcwFnvut8yW_NGv4BeIRMCNZuRfXjYMJGoY6JQmV4uQ-ANbj5L4ILZMVKMXiX941RkqrB_zWfgW_qg7GcRl9e6_Z7vyCbWtLVeQ7BvGLnsOoQ8KeuvXNo_nn1LuUZelC-wjAbTSbuU0ab7ESh50hRNpCRJ3uKhZSdQ"/>
</div>
<div class="mt-4 flex justify-between">
<div class="w-24 h-3 bg-outline-variant rounded-full"></div>
<div class="w-8 h-3 bg-tertiary/40 rounded-full"></div>
</div>
</div>
